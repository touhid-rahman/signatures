    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;

        padding: 40px 20px;

    .container {
        width: 100%;
        max-width: 500px;
        background: #fff;

        margin-bottom: 30px;
    }

    ul {
        list-style: none;
    }

    li+li {
        margin-top: 12px;
    }

    a {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #333;
        background: #f8f9fb;
        padding: 14px 18px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        transition: all .2s ease;
        font-weight: 600;
    }

    a i {
        width: 22px;
        font-size: 1.15rem;
        text-align: center;
    }

    a:hover {
        background: #7952b3;
        color: #fff;
        transform: translateX(5px);
